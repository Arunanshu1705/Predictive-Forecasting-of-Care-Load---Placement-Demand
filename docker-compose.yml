version: '3.8'

services:
  # Streamlit Dashboard
  streamlit:
    build: .
    container_name: capacity_analytics_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # FastAPI Backend (optional)
  api:
    build: .
    container_name: capacity_analytics_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - analytics_network
    depends_on:
      - streamlit

networks:
  analytics_network:
    driver: bridge

volumes:
  data:
  reports:
  output:
  logs:
